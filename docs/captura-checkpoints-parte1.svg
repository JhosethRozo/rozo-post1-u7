<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" height="100%">
  <rect width="900" height="640" rx="10" fill="#0f172a" />
  <circle cx="25" cy="22" r="6" fill="#ef4444" />
  <circle cx="45" cy="22" r="6" fill="#f59e0b" />
  <circle cx="65" cy="22" r="6" fill="#10b981" />
  <text x="320" y="27" fill="#94a3b8" font-family="'Consolas', monospace" font-size="12">Terminal — Checkpoints Verificación Parte 1</text>
  <line x1="0" y1="42" x2="900" y2="42" stroke="#334155" stroke-width="1" />

  <g font-family="'Consolas', monospace" font-size="12">
    <!-- CP 1 -->
    <text x="25" y="65" fill="#38bdf8">$ curl -i -X GET http://localhost:8080/api/multas</text>
    <text x="25" y="85" fill="#4ade80">HTTP/1.1 200 OK  [Content-Type: application/json]</text>
    <text x="25" y="105" fill="#f8fafc">[]</text>

    <!-- CP 2 -->
    <text x="25" y="135" fill="#38bdf8">$ curl -i -X POST http://localhost:8080/api/multas -H "Content-Type: application/json" -d '{"estudianteId":"EST-101","concepto":"Clean Code","diasAtraso":4}'</text>
    <text x="25" y="155" fill="#4ade80">HTTP/1.1 201 Created</text>
    <text x="25" y="175" fill="#cbd5e1">{"id": 1, "estudianteId": "EST-101", "concepto": "Clean Code", "diasAtraso": 4, <tspan fill="#facc15">"monto": 2000</tspan>, "estado": "PENDIENTE", "fechaGeneracion": "2026-10-07"}</text>

    <!-- CP 3 -->
    <text x="25" y="205" fill="#38bdf8">$ curl -i -X POST http://localhost:8080/api/multas -H "Content-Type: application/json" -d '{"estudianteId":"","concepto":"Clean Code","diasAtraso":4}'</text>
    <text x="25" y="225" fill="#f87171">HTTP/1.1 400 Bad Request</text>
    <text x="25" y="245" fill="#fca5a5">{"estudianteId": "El código de estudiante es obligatorio"}</text>

    <!-- CP 4 -->
    <text x="25" y="275" fill="#38bdf8"># Creación de multa 2 y 3 para EST-101 (201 Created)...</text>
    <text x="25" y="295" fill="#38bdf8">$ curl -i -X POST http://localhost:8080/api/multas -H "Content-Type: application/json" -d '{"estudianteId":"EST-101","concepto":"Cuarta multa","diasAtraso":1}'</text>
    <text x="25" y="315" fill="#f87171">HTTP/1.1 409 Conflict</text>
    <text x="25" y="335" fill="#fca5a5">{"error": "El estudiante EST-101 ya tiene 3 multas pendientes (límite: 3)"}</text>

    <!-- CP 5 -->
    <text x="25" y="365" fill="#38bdf8">$ curl -i -X GET http://localhost:8080/api/multas/9999</text>
    <text x="25" y="385" fill="#f87171">HTTP/1.1 404 Not Found</text>
    <text x="25" y="405" fill="#fca5a5">{"error": "Multa 9999 no encontrada"}</text>

    <!-- CP 6 -->
    <text x="25" y="435" fill="#38bdf8">$ curl -i -X PATCH http://localhost:8080/api/multas/1/pagar</text>
    <text x="25" y="455" fill="#4ade80">HTTP/1.1 200 OK</text>
    <text x="25" y="475" fill="#cbd5e1">{"id": 1, "estado": "PAGADA", <tspan fill="#38bdf8">"metodoPago": "VENTANILLA"</tspan>, "fechaPago": "2026-10-07"}</text>

    <!-- CP 6 Reintento -->
    <text x="25" y="505" fill="#38bdf8">$ curl -i -X PATCH http://localhost:8080/api/multas/1/pagar</text>
    <text x="25" y="525" fill="#f87171">HTTP/1.1 409 Conflict</text>
    <text x="25" y="545" fill="#fca5a5">{"error": "La multa 1 ya fue pagada el 2026-10-07"}</text>

    <!-- Resumen -->
    <line x1="25" y1="570" x2="875" y2="570" stroke="#334155" stroke-width="1" />
    <text x="25" y="595" fill="#10b981">✔ Todos los 6 checkpoints de la Parte 1 verificados y aprobados con éxito.</text>
    <text x="25" y="615" fill="#94a3b8">  Separación en 4 capas respetada: Controller -&gt; Service -&gt; Domain (Multa) + Repository (H2 COUNT SQL)</text>
  </g>
</svg>
