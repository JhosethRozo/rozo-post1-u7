<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 650" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .layer-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; }
      .box-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; }
      .box-desc { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .code-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; fill: #334155; }
      .badge { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #ffffff; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-dash { stroke: #0284c7; stroke-width: 2; stroke-dasharray: 5,5; fill: none; marker-end: url(#arrowhead-blue); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" />

  <!-- Title Section -->
  <text x="40" y="45" class="title">Arquitectura del Sistema: Multas de Biblioteca</text>
  <text x="40" y="68" class="subtitle">Capas Tradicionales (Parte 1) + Rebanada Hexagonal con Puerto y Adaptadores (Parte 2)</text>

  <!-- CAPA PRESENTACIÓN -->
  <rect x="40" y="95" width="870" height="95" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="95" width="8" height="95" rx="4" fill="#6366f1" />
  <text x="60" y="122" class="layer-title" fill="#4338ca">Capa de Presentación (controller/)</text>
  <rect x="60" y="132" width="380" height="45" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="75" y="152" class="box-title">MultaController (@RestController)</text>
  <text x="75" y="167" class="box-desc">/api/multas (CRUD, /pagar, /pagar-en-linea)</text>
  <rect x="460" y="132" width="380" height="45" rx="6" fill="#fee2e2" stroke="#fecaca"/>
  <text x="475" y="152" class="box-title">GlobalExceptionHandler (@RestControllerAdvice)</text>
  <text x="475" y="167" class="box-desc">Mapea excepciones a 400, 404, 409 y 402 Payment Required</text>

  <!-- Flow Arrow -->
  <path d="M 250 190 L 250 215" class="arrow"/>

  <!-- CAPA DE APLICACIÓN -->
  <rect x="40" y="215" width="870" height="95" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="215" width="8" height="95" rx="4" fill="#0ea5e9" />
  <text x="60" y="242" class="layer-title" fill="#0369a1">Capa de Aplicación (service/)</text>
  <rect x="60" y="252" width="780" height="45" rx="6" fill="#e0f2fe" stroke="#bae6fd"/>
  <text x="75" y="272" class="box-title">MultaService (@Service, @Transactional)</text>
  <text x="75" y="287" class="box-desc">Orquesta casos de uso: límite de 3 multas pendientes (Punto 2), pago en ventanilla y pago en línea</text>

  <!-- Flow Arrows -->
  <path d="M 250 310 L 250 340" class="arrow"/>
  <path d="M 650 310 L 650 340" class="arrow"/>

  <!-- CAPA DE DOMINIO -->
  <rect x="40" y="340" width="870" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="340" width="8" height="150" rx="4" fill="#10b981" />
  <text x="60" y="367" class="layer-title" fill="#047857">Capa de Dominio (model/ y domain/)</text>

  <!-- Box Dominio Entidad -->
  <rect x="60" y="380" width="380" height="95" rx="6" fill="#d1fae5" stroke="#a7f3d0"/>
  <text x="75" y="402" class="box-title">model/ — Multa &amp; EstadoMulta</text>
  <text x="75" y="420" class="code-text">public static calcularMonto(diasAtraso)</text>
  <text x="75" y="435" class="box-desc">Regla pura en entidad: $500/día, tope $15.000 (Punto 1)</text>
  <text x="75" y="455" class="box-desc">Excepciones: MultaNotFound, LimiteMultas, YaPagada</text>

  <!-- Box Hexagonal Port -->
  <rect x="460" y="380" width="430" height="95" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <rect x="760" y="388" width="115" height="18" rx="4" fill="#047857"/>
  <text x="768" y="401" class="badge">PUERTO HEXAGONAL</text>
  <text x="475" y="402" class="box-title">domain/port/PasarelaPagoPort (Java Puro)</text>
  <text x="475" y="420" class="code-text">ResultadoPago procesar(Multa multa)</text>
  <text x="475" y="440" class="box-desc">Contrato agnóstico sin Spring ni clientes HTTP (Punto 4)</text>
  <text x="475" y="458" class="box-desc">Modelo: ResultadoPago, Excepción: PagoRechazadoException</text>

  <!-- Flow Arrows downwards -->
  <path d="M 250 490 L 250 515" class="arrow"/>
  <path d="M 680 475 L 680 515" class="arrow-dash"/>

  <!-- CAPA DE INFRAESTRUCTURA -->
  <rect x="40" y="515" width="870" height="115" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="515" width="8" height="115" rx="4" fill="#f59e0b" />
  <text x="60" y="538" class="layer-title" fill="#b45309">Capa de Infraestructura (repository/ e infrastructure/)</text>

  <!-- Box Repository -->
  <rect x="60" y="550" width="380" height="65" rx="6" fill="#fef3c7" stroke="#fde68a"/>
  <text x="75" y="570" class="box-title">repository/MultaRepository (@Repository)</text>
  <text x="75" y="588" class="code-text">countByEstudianteIdAndEstado(..., PENDIENTE)</text>
  <text x="75" y="603" class="box-desc">SQL COUNT directo en base de datos H2 (Punto 2)</text>

  <!-- Box Adapters -->
  <rect x="460" y="550" width="205" height="65" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="470" y="568" class="box-title">PagosUdesAdapter</text>
  <text x="470" y="583" class="box-desc">@Conditional (pagosudes)</text>
  <text x="470" y="598" class="box-desc">Traduce id/estado a DTO</text>

  <rect x="685" y="550" width="205" height="65" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="695" y="568" class="box-title">WompiAdapter</text>
  <text x="695" y="583" class="box-desc">@Conditional (wompi)</text>
  <text x="695" y="598" class="box-desc">Convierte a centavos/ref</text>
</svg>
